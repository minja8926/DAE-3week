<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Unit Converter</h1>
    </header>

    <main>
      <div class="converter">
        <!-- Image (requirement) -->
        <img src="smile.png" alt="Smiley face" width="100" />

        <!-- Category -->
        <label>Category:</label>
        <select id="category">
          <option value="length">Length</option>
          <option value="weight">Weight</option>
        </select>

        <!-- Value -->
        <label>Value:</label>
        <input type="number" id="value" placeholder="Enter value" />

        <!-- From / To -->
        <div class="row">
          <select id="fromUnit"></select>
          <span>→</span>
          <select id="toUnit"></select>
        </div>

        <!-- Result -->
        <p id="result"></p>

        <!-- List (requirement) -->
        <ul>
          <li>Convert length units</li>
          <li>Convert weight units</li>
        </ul>
      </div>
    </main>

    <footer>
      <h4>Footer</h4>
      <nav>
        <a href="https://www.desmos.com/scientific">Scientific Calculator</a>
        <a href="about.html">Meet the Creator</a>
      </nav>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
